<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 330px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        color: white;
        font-weight: 650;
        cursor: pointer;
        margin-top: 8px;
      }
      button.primary {
        background: #2563eb;
      }
      button.secondary {
        background: #0f766e;
      }
      button.danger {
        background: #b91c1c;
      }
      button:disabled {
        opacity: 0.58;
        cursor: not-allowed;
      }
      label {
        display: grid;
        gap: 4px;
        margin-top: 10px;
        font-size: 12px;
        color: #404040;
      }
      input {
        border: 1px solid #d4d4d4;
        border-radius: 7px;
        padding: 8px;
        font: inherit;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.5;
        color: #525252;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <button id="capture" class="primary">Capture Current Conversation</button>
    <label>
      Max conversations
      <input id="maxItems" type="number" min="1" max="3000" value="1000" />
    </label>
    <label>
      Scroll delay ms
      <input id="delayMs" type="number" min="1200" max="30000" value="3200" />
    </label>
    <button id="fullCapture" class="secondary">Start Full History Capture</button>
    <button id="allPlatformsCapture" class="secondary">Start All Platforms Capture</button>
    <button id="stopCapture" class="danger">Stop Full Capture</button>
    <button id="resumeCapture" class="secondary">Resume Queue</button>
    <button id="clearStatus" class="danger">Clear Status</button>
    <div id="status">AI History Recall must be running at http://localhost:3000</div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
