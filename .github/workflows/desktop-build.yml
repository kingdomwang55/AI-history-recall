name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "desktop/**"
      - "extension/**"
      - "scripts/prepare-desktop-sidecar.mjs"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            artifact: ai-history-recall-macos-dmg
            bundles: dmg
          - name: Windows installers
            os: windows-latest
            artifact: ai-history-recall-windows-installers
            bundles: "nsis,msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Use stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select packaged Node runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "AIHR_DESKTOP_NODE_BINARY=$(node -p 'process.execPath')" >> "$GITHUB_ENV"

      - name: Select packaged Node runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodePath = node -p "process.execPath"
          "AIHR_DESKTOP_NODE_BINARY=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify JavaScript and TypeScript
        run: |
          npm test
          npm run lint
          npx tsc --noEmit

      - name: Verify Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Prepare packaged UI and sidecar
        run: npm run desktop:prepare

      - name: Build unsigned installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
